[package]
name = "codcel-calculation-engine"
version = "0.1.10"
edition = "2021"
rust-version = "1.89"
authors = ["Codcel <support@codcel.io>"]
description = "Rust implementations of Excel functions: financial, statistical, engineering, text and date. Builds for native and WebAssembly targets. The calculation core of Codcel (codcel.io): Excel in, real code out."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codcel-io/codcel-calculation-engine"
homepage = "https://codcel.io"
keywords = ["excel", "spreadsheet", "formulas", "finance", "statistics"]
categories = ["mathematics", "finance", "science"]
include = [
    "src/**/*.rs",
    "clippy.toml",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["locale-data", "named-timezones", "mock-clock"]
# The full CLDR locale table. With it off `src/locale/data.rs` collapses to the
# `en` entry alone, which keeps an English-only wasm bundle from carrying 76
# locales it never looks up.
locale-data = []
# IANA timezone names for `CODCEL_TIMEZONE` / `ValueFormat::timezone`. Without
# it `NOW` and `TODAY` still read the host's local clock, they just cannot be
# pointed at a named zone. Costs the embedded tz database, so wasm builds that
# do not need named zones can turn it off.
named-timezones = ["dep:chrono-tz"]
# Honour `CODCEL_MOCK_NOW` to freeze the clock. Generated test suites need this
# — a workbook with a `TODAY()` cell otherwise only passes on the day it was
# saved. Turn it off for a build that must not read the clock from the
# environment at all.
mock-clock = []

[dependencies]
serde = { version= "1.0.229", features= ['derive'] }
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
unicode-segmentation = "1.13.3"
libm = "0.2.16"
fastrand = "2.5.0"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
statrs = { version = "0.19.0", default-features = false }
sys-locale = "0.3.2"
chrono-tz = { version = "0.10", optional = true }

[dev-dependencies]
# Test-only: exercises the serde back-compat guarantee on `ValueFormat`, which
# the generated FFI/JNI `*_with_format` entry points rely on.
serde_json = "1.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
