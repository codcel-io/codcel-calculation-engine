name: CI

on:
  push:
    branches: [main, "pre-release-*"]
  pull_request:
    branches: [main, "pre-release-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Clippy cannot lint its own suppressions. Every panic site in src/ was fixed
      # rather than allowed, so any mention of these three lints in source is an attempt
      # to reopen the gate. Scoped to src/ - tests/ carries a documented exemption.
      - name: Panic lints must not be silenced
        run: |
          if grep -rn --include='*.rs' -E 'clippy::(unwrap_used|expect_used|panic)\b' src/; then
            echo "::error::A panic lint was silenced in src/."
            exit 1
          fi

      # A public repo must not cite a private one. The expected values come from
      # Excel and every test carries its own formula, so a path into an internal
      # repository is a dangling reference for every reader outside the org.
      # `git grep` reads tracked files only, so an untracked file cannot satisfy it.
      - name: No references to private repositories
        run: |
          if git grep -nE 'codcel-(tests|desktop|calamine)' -- '*.rs' '*.md' '*.toml'; then
            echo "::error::A private repository is referenced from a public repo."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features --verbose

      - name: Test
        run: cargo test --all-features --verbose
